const DATA={"cases": [{"id": "EX-001", "po": "DEM-C01", "material": "Brides forjades · acer inoxidable", "project": "PR-DEMO-01 · Filtre de cistella", "owner": "Qualitat", "doc": "Certificat de material · DEM-MAT-01", "rev": "Referència per comprovar", "risk": "Documentació pendent", "stage": "Rebut · no acceptat"}, {"id": "EX-002", "po": "DEM-C02", "material": "Malla metàl·lica · element filtrant", "project": "PR-DEMO-01 · Filtre de cistella", "owner": "Producció", "doc": "Confirmació de termini · DEM-TERM-02", "rev": "Proposta, no compromís acceptat", "risk": "Data per acordar", "stage": "En fabricació al proveïdor"}, {"id": "EX-003", "po": "DEM-C03", "material": "Peça tallada a làser · plànol", "project": "PR-DEMO-02 · Filtre doble", "owner": "Enginyeria", "doc": "Plànol DEM-PL-03 · revisions A / B", "rev": "Discrepància A / B", "risk": "Revisió no validada", "stage": "Pendent d’autorització tècnica"}, {"id": "EX-004", "po": "DEM-C04", "material": "Tubs i accessoris · acer inoxidable", "project": "PR-DEMO-02 · Filtre doble", "owner": "Magatzem + Compres", "doc": "Albarà parcial · DEM-ALB-04", "rev": "Desglossament pendent", "risk": "Recepció parcial", "stage": "Primer lliurament rebut"}, {"id": "EX-005", "po": "DEM-C05", "material": "Junta d’estanquitat · material alternatiu", "project": "PR-DEMO-03 · Skid de filtració", "owner": "Enginyeria + Qualitat", "doc": "Fitxa comparativa · DEM-FT-05", "rev": "Alternativa no aprovada", "risk": "Canvi de material", "stage": "Pendent de decisió"}, {"id": "EX-006", "po": "DEM-C06", "material": "Peça tractada · acabat superficial", "project": "PR-DEMO-03 · Skid de filtració", "owner": "Qualitat", "doc": "Informe de procés · DEM-IP-06", "rev": "Evidència pendent", "risk": "Informe pendent", "stage": "Material retornat"}, {"id": "EX-007", "po": "DEM-C07", "material": "Conjunt mecanitzat · transport", "project": "PR-DEMO-03 · Skid de filtració", "owner": "Logística", "doc": "Fitxa logística · DEM-LOG-07", "rev": "Proposta per confirmar", "risk": "Expedició no coordinada", "stage": "Preparat al proveïdor"}, {"id": "EX-008", "po": "DEM-C08", "material": "Element filtrant · identificació de lot", "project": "PR-DEMO-01 · Filtre de cistella", "owner": "Qualitat + Magatzem", "doc": "Etiqueta i certificat · DEM-LOT-08", "rev": "Lots DEM-L01 / DEM-L02", "risk": "Traçabilitat per aclarir", "stage": "Rebut · discrepància oberta"}]};
const cases=DATA.cases,projectNames=[...new Set(cases.map(x=>x.project))];
const dayNames=['Dilluns','Dimarts','Dimecres','Dijous','Divendres'];
const resources=['Tall · recurs de mostra','Muntatge · recurs de mostra','Revisió · recurs de mostra'];
const initial=[
{id:'OF-DEMO-01',project:projectNames[0],op:'Preparació i tall',resource:resources[0],day:0,hours:4,dependency:null,caseId:'EX-001'},
{id:'OF-DEMO-02',project:projectNames[0],op:'Muntatge del filtre',resource:resources[1],day:1,hours:5,dependency:'OF-DEMO-01',caseId:'EX-002'},

{id:'OF-DEMO-05',project:projectNames[2],op:'Muntatge del conjunt',resource:resources[1],day:3,hours:6,dependency:null,caseId:'EX-005'},
{id:'OF-DEMO-06',project:projectNames[2],op:'Revisió final',resource:resources[2],day:4,hours:3,dependency:'OF-DEMO-05',caseId:'EX-006'}];
let planOps=structuredClone(initial),page='projects',projectChoice='all',resolved={},planPublished=false;
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function rows(xs,cols){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${xs.map(x=>`<tr>${cols.map(c=>`<td data-label="${c[0]}">${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function selected(p){return projectChoice==='all'||projectChoice===p}
function filter(){return `<select aria-label="Filtrar per projecte" onchange="projectChoice=this.value;renderApp()"><option value="all">Tots els projectes de mostra</option>${projectNames.map(p=>`<option ${p===projectChoice?'selected':''}>${p}</option>`).join('')}</select>`}
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){document.getElementById('nav').innerHTML=[['projects','Traçabilitat per projecte'],['planner','Planificació de producció']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')" ${page===p?'aria-current="page"':''}>${t}</button>`).join('');document.getElementById('crumb').textContent=page==='projects'?'Traçabilitat per projecte':'Planificació de producció';document.getElementById('eyebrow').textContent=page==='projects'?'COMPRES → MATERIALS → FABRICACIÓ':'PLANIFICADOR SETMANAL · PRODUCCIÓ';document.getElementById('title').textContent=page==='projects'?'Un projecte, tot el fil':'La setmana de producció, visible';document.getElementById('subtitle').textContent=page==='projects'?'Compra, material pendent i operació vinculada. Sense reconstruir el projecte en llistes separades.':'Dia, recurs, càrrega i material pendent. Un pla per revisar a la reunió setmanal i traslladar al taller.';renderApp()}
function renderApp(){document.getElementById('app').innerHTML=page==='projects'?projects():planner()}
function limitNote(){return `<div class="banner info"><strong>Només traçabilitat per projecte i planificació de producció.</strong>Projectes, documents, operacions, hores i capacitats de mostra. Cap dada de clients ni connexió real. La versió i els mòduls d'Odoo s'han de confirmar abans de definir la implantació.</div>`}
function traceButton(x){return `<button class="btn small" onclick="trace('${x.id}')">Veure traça</button>`}
function projects(){let xs=cases.filter(x=>selected(x.project));return limitNote()+`<div class="toolbar">${filter()}<button class="btn" onclick="go('planner')">Veure planificació de producció →</button></div><div class="supplier-grid">${projectNames.filter(selected).map(p=>{let c=cases.filter(x=>x.project===p),os=planOps.filter(o=>o.project===p);return `<section class="panel pad"><div class="eyebrow">Projecte sintètic</div><h2>${p}</h2><p class="tiny">${c.length} línies vinculades · ${os.length} operacions de mostra</p><span class="tag amber">${c.filter(x=>!resolved[x.id]).length} controls pendents</span><div class="actions"><button class="btn small" onclick="projectChoice='${p}';renderApp()">Filtrar projecte</button><button class="btn small" onclick="projectChoice='${p}';go('planner')">Veure pla</button></div></section>`}).join('')}</div><section class="panel" style="margin-top:20px"><div class="section-head"><h2>Què falta a cada projecte?</h2><span class="tag">${xs.length} línies sintètiques</span></div>${rows(xs,[['Projecte / compra',x=>`<strong>${x.project}</strong><span class="tiny">${x.po}</span>`],['Material i document vinculat',x=>`<strong>${x.material}</strong><span class="tiny">${x.doc}</span>`],['Situació de compra',x=>x.stage],['Validació / pendent',x=>`<span class="tag ${resolved[x.id]?'green':'amber'}">${resolved[x.id]?'Control resolt en la mostra':x.risk}</span><span class="tiny">${x.owner}</span>`],['Traçabilitat',traceButton]])}</section><p class="note">La recepció física no equival a l'acceptació tècnica. La demo vincula referències, no comprova un material, un certificat ni una revisió de plànol reals.</p>`}
function trace(id){let x=cases.find(x=>x.id===id),os=planOps.filter(o=>o.caseId===id),c=cases.filter(c=>c.project===x.project);modal('Traçabilitat del projecte',`<div class="eyebrow">${x.project} · dades de mostra</div><h2>${x.material}</h2><ol class="timeline"><li><strong>1. Compra vinculada · ${x.po}</strong><p>${x.stage}. Línia sintètica, no document comercial real.</p></li><li><strong>2. Recepció i disponibilitat</strong><p>${x.risk}. Cal la revisió del rol ${x.owner}.</p></li><li><strong>3. Referència documental</strong><p>${x.doc}<br>${x.rev}. No hi ha cap certificat ni plànol industrial vàlid.</p></li><li><strong>4. Operació de producció</strong><p>${os.length?os.map(o=>`${o.id} · ${o.op} · ${dayNames[o.day]}`).join('<br>'):'Control de projecte sense operació directa en aquesta mostra.'}</p></li></ol><div class="banner info">La comprovació següent només canvia un estat fictici en aquesta pestanya. No accepta material real ni allibera fabricació.</div><button class="btn primary" onclick="toggleControl('${id}')">${resolved[id]?'Tornar a pendent en la mostra':'Marcar control resolt en la mostra'}</button><button class="btn" style="margin-top:10px" onclick="closeModal();projectChoice='${x.project}';go('planner')">Veure el pla d'aquest projecte</button><p class="note">El projecte té ${c.length} controls de mostra. Resoldre'n un no resol els altres.</p>`)}
function toggleControl(id){resolved[id]=!resolved[id];planPublished=false;closeModal();renderApp()}
function warnings(o){let w=[],load=planOps.filter(x=>x.resource===o.resource&&x.day===o.day).reduce((a,x)=>a+x.hours,0),dep=planOps.find(x=>x.id===o.dependency);if(load>8)w.push(`Sobrecàrrega: ${load} h / 8 h de mostra`);if(dep&&dep.day>=o.day)w.push(`Dependència: després de ${dep.id}`);let pending=cases.filter(x=>x.project===o.project&&!resolved[x.id]);if(pending.length)w.push(`${pending.length} controls de projecte pendents`);return w}
function changeOp(id,key,value){let o=planOps.find(o=>o.id===id);o[key]=key==='day'?Number(value):value;planPublished=false;renderApp()}
function planner(){let os=planOps.filter(o=>selected(o.project)),pending=cases.filter(x=>selected(x.project)&&!resolved[x.id]);return limitNote()+`<div class="toolbar">${filter()}<button class="btn" onclick="go('projects')">Tornar a la traçabilitat</button></div><div class="banner"><strong>Planificació manual assistida, no optimització automàtica.</strong>Setmana sense dates compromeses. Capacitat fictícia: 8 h/dia/recurs. Planificació per dies, no per minuts. Les dependències exigeixen dies posteriors en aquesta mostra.</div><section class="panel"><div class="section-head"><h2>Pla setmanal editable · ${os.length} operacions</h2><span class="tag">Canvis només en aquesta pestanya</span></div>${rows(os,[['Ordre / projecte',o=>`<strong>${o.id} · ${o.op}</strong><span class="plan-meta">${o.project}</span><span class="plan-meta">${o.hours} h de mostra</span>`],['Dia',o=>`<select aria-label="Dia ${o.id}" onchange="changeOp('${o.id}','day',this.value)">${dayNames.map((d,i)=>`<option value="${i}" ${o.day===i?'selected':''}>${d}</option>`).join('')}</select>`],['Recurs',o=>`<select aria-label="Recurs ${o.id}" onchange="changeOp('${o.id}','resource',this.value)">${resources.map(r=>`<option ${o.resource===r?'selected':''}>${r}</option>`).join('')}</select>`],['Avisos i dependències',o=>`${warnings(o).length?warnings(o).map(w=>`<span class="tag amber" style="margin-bottom:6px;white-space:normal">${w}</span>`).join('<br>'):'<span class="tag green">Sense avisos de mostra</span>'}<span class="tiny">${o.dependency?'Després de '+o.dependency:'Sense predecessor de mostra'}</span><button class="linkbtn tiny" onclick="trace('${o.caseId}')">Veure traça del material</button>`]])}</section><section class="panel pad" style="margin-top:20px"><h2>Càrrega i capacitat per dia</h2><p class="tiny muted">Inclou tots els projectes de mostra, encara que només en filtris un.</p>${rows(resources.map(r=>({r})),[['Recurs',x=>x.r],...dayNames.map((d,i)=>[d,x=>{let n=planOps.filter(o=>o.resource===x.r&&o.day===i).reduce((a,o)=>a+o.hours,0);return `<span class="tag ${n>8?'amber':'green'}">${n} / 8 h</span>`}])])}</section><section class="panel" style="margin-top:20px"><div class="section-head"><h2>Preparar la reunió setmanal · ${pending.length} controls pendents</h2></div>${pending.length?rows(pending,[['Projecte',x=>x.project],['Material / compra',x=>`<strong>${x.material}</strong><span class="tiny">${x.po}</span>`],['Decisió pendent',x=>`<span class="tiny">${x.risk} · ${x.owner}</span>`],['Consultar',traceButton]]):'<div class="pad">Cap control pendent en aquest filtre. Això no acredita disponibilitat ni qualitat reals.</div>'}</section><section class="panel pad" style="margin-top:20px"><h2>Vista per al taller · pla de mostra</h2><p class="tiny muted">La revisió és global: no es confirma el pla si algun projecte de mostra té avisos. Cap notificació ni enviament real.</p><button class="btn primary" onclick="reviewPlan()">Revisar pla de mostra</button><div id="planDecision" style="margin-top:14px">${planPublished?'<div class="banner">Pla de mostra revisat. No enviat.</div>':''}</div>${rows(os,[['Dia',o=>dayNames[o.day]],['Operació',o=>`<strong>${o.op}</strong><span class="tiny">${o.project}</span>`],['Recurs',o=>o.resource],['Situació',o=>`<span class="tag ${warnings(o).length?'amber':'green'}">${warnings(o).length?'Pendent de revisió':'Planificada en la mostra'}</span>`]])}</section>`}
function reviewPlan(){let n=planOps.filter(o=>warnings(o).length).length;planPublished=n===0;document.getElementById('planDecision').innerHTML=n?`<div class="banner warn">Pla no confirmat: ${n} operacions tenen avisos. Revisa material, capacitat i dependències. No s'ha enviat res.</div>`:`<div class="banner">Pla de mostra revisat. No enviat al taller ni a Odoo.</div>`}
let focusBeforeModal=null;function modal(title,body){focusBeforeModal=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="btn small" aria-label="Tancar finestra" onclick="closeModal()">Tancar</button></div><div class="modal-body">${body}</div></section></div>`;document.querySelector('.modal button').focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML='';focusBeforeModal?.focus()}
function askReset(){modal('Reiniciar la demo?',`<p>Es perdran els canvis ficticis de planificació i controls d'aquesta pestanya. Cap dada externa queda afectada.</p><button class="btn primary" onclick="resetDemo()">Sí, reiniciar</button>`)}
function resetDemo(){resolved={};planOps=structuredClone(initial);projectChoice='all';planPublished=false;closeModal();go('projects')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){let fs=[...document.querySelectorAll('.modal button')];if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus()}}});render();
</script></body></html>
